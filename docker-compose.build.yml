# 从源码构建部署（离线修改代码时使用；常规部署直接用 docker-compose.yml 拉取镜像即可）
services:
  vps-calculator:
    build: .
    image: vps-calculator:local
    container_name: vps-calculator
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - vps-data:/var/www/data
      - vps-share:/var/www/html/share

volumes:
  vps-data:
  vps-share:
