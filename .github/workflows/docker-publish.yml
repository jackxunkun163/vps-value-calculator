name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：配置了仓库 Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后，
      # 镜像会同时推送到 Docker Hub（docker.io）
      - name: Log in to Docker Hub (optional)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            echo "dockerhub_login=1" >> "$GITHUB_ENV"
          else
            echo "Docker Hub secrets 未配置，本次仅推送到 ghcr.io"
          fi

      - name: Resolve image names
        id: names
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${{ github.repository }}"
            if [ "${{ env.dockerhub_login }}" = "1" ]; then
              echo "${DH_USER}/vps-value-calculator"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
