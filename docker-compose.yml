services:
  vps-calculator:
    build: .
    image: vps-calculator:latest
    container_name: vps-calculator
    restart: unless-stopped
    ports:
      - "8080:80"   # 左侧为宿主机端口，可按需修改
    volumes:
      - vps-data:/var/www/data      # 汇率缓存 / 计数数据
      - vps-share:/var/www/html/share  # 生成的 SVG 分享图

volumes:
  vps-data:
  vps-share:
